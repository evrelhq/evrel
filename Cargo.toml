[workspace]
resolver = "3"
members = [
    "crates/evrel-ir",
    "crates/evrel-frontend",
    "crates/evrel-codegen-js",
    "crates/evrel-compiler",
    "crates/evrel-cli",
    "crates/evrel-node",
]

[workspace.dependencies]
bitflags = "2.11.0"
clap = { version = "4.6.1", features = ["derive"] }
napi = "3.10.5"
napi-build = "2.3.2"
napi-derive = "3.5.9"
oxc_allocator = "=0.140.0"
oxc_ast = "=0.140.0"
oxc_ast_visit = "=0.140.0"
oxc_codegen = "=0.140.0"
oxc_ecmascript = "=0.140.0"
oxc_parser = "=0.140.0"
oxc_semantic = "=0.140.0"
oxc_span = "=0.140.0"
oxc_syntax = "=0.140.0"
rustc-hash = "2.1.3"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
wait-timeout = "0.2.1"
